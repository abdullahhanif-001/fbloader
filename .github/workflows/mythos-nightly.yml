name: mythos-nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  mythos-full:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.12.5"
      - name: Install dependencies (locked)
        run: |
          uv sync --frozen --no-build --no-binary-package fbload
          uv pip install --only-binary :all: \
            "pytest==9.1.1" "pytest-timeout==2.4.0" "pytest-cov==7.1.0" \
            "psutil==7.2.2" "ruff==0.16.3" "bandit==1.9.4"
          uv pip install --only-binary :all: "torch==2.11.0" --index-url https://download.pytorch.org/whl/cpu
      - name: Mythos full soak (50k steps)
        run: |
          uv run --frozen --no-build --no-sync --no-binary-package fbload python tests/test_mythos_hardening.py \
            --steps 50000 \
            --batch-size 32 \
            --num-workers 4 \
            --crop 224
      - name: Upload telemetry artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mythos-telemetry-report
          path: tests/mythos_telemetry_report.json
          if-no-files-found: warn
